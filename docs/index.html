<style>
@font-face { font-family: "Kouang Si Waterfall"; src: url("fonts/KouangSiWaterfall-Regular.woff2") format("woff2"); font-display: block; }
:root {
  --bg: #0b5d63; --ink: #f4fbf8; --accent: #7de3d6; --panel: #0e6d74; --muted: #bfe3de;

  --body: "Noto Sans", "Noto Sans Lao", "Noto Sans Thai", "Noto Sans Khmer", system-ui, sans-serif;
  --gutter: clamp(16px, 4vw, 56px); --measure: 62ch;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 1.0625rem/1.65 var(--body); }
html[lang=lo] body { font-family: "Noto Sans Lao", "Noto Sans", sans-serif; }
html[lang=th] body { font-family: "Noto Sans Thai", "Noto Sans", sans-serif; }
html[lang=km] body { font-family: "Noto Sans Khmer", "Noto Sans", sans-serif; line-height: 1.8; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.bar { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; justify-content: space-between; padding: 18px var(--gutter); }
.wordmark { font: 1.7rem/1.2 var(--display); color: var(--ink); text-decoration: none; }
.langs { display: flex; gap: 6px; flex-wrap: wrap; }
.langs button { font: 600 .95rem var(--body); cursor: pointer; background: transparent; color: var(--ink); border: 2px solid var(--ink); padding: 4px 12px; }
.langs button[aria-pressed=true] { background: var(--ink); color: var(--bg); }
.langs button:nth-child(2) { font-family: "Noto Sans Lao"; } .langs button:nth-child(3) { font-family: "Noto Sans Thai"; } .langs button:nth-child(4) { font-family: "Noto Sans Khmer"; }
.hero { padding: 1vh var(--gutter) 0; position: relative; }
.beta { display: inline-block; font: 600 .9rem var(--body); color: var(--bg); background: var(--accent); padding: 3px 12px; margin-bottom: .6rem; }
.tester { font-family: var(--display); font-size: var(--size, 11vw); line-height: 1.45; color: var(--accent); margin: 0; padding: .1em 0 .15em; outline: none; overflow-wrap: anywhere; min-height: 1.4em; caret-color: var(--ink); }
.tester:focus-visible { outline: 3px dashed var(--ink); outline-offset: 6px; }
.tagline { font-size: clamp(1.15rem, 2.2vw, 1.5rem); font-weight: 600; max-width: 40ch; margin: .3em 0 .6rem; }
.hint { color: var(--muted); margin: 0 0 1.2rem; }
.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-bottom: 1.3rem; }
.controls label { display: flex; align-items: center; gap: 10px; font-weight: 600; }
input[type=range] { accent-color: var(--accent); width: min(220px, 50vw); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { font: 1.1rem var(--display); cursor: pointer; background: var(--panel); color: var(--ink); border: 2px solid var(--ink); padding: 4px 12px; }
.chip:hover { background: var(--ink); color: var(--bg); }
.reset { font: 600 .95rem var(--body); background: none; border: none; color: var(--accent); text-decoration: underline; cursor: pointer; }
.actions { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.download { font: 1.35rem/1 var(--display); background: var(--ink); color: var(--bg); text-decoration: none; padding: 16px 24px 14px; }
.download:hover { background: var(--accent); color: var(--bg); }
.beta-note { max-width: var(--measure); margin: 1.4rem 0 0; padding: 12px 16px; border-left: 6px solid var(--accent); background: var(--panel); }
main section { padding: clamp(44px, 8vh, 90px) var(--gutter) 0; }
h2 { font: clamp(1.8rem, 4vw, 3rem)/1.35 var(--display); margin: 0 0 .5rem; max-width: 24ch; }
p { max-width: var(--measure); }
.scriptlines { display: grid; gap: .2rem; margin-top: 1rem; }
.scriptlines div { font: clamp(2rem, 6vw, 4.6rem)/1.6 var(--display); overflow-wrap: anywhere; }
.scriptlines small { display: block; font: 600 .85rem var(--body); color: var(--muted); }
.stack { font: clamp(2.4rem, 7vw, 5.6rem)/1.75 var(--display); word-spacing: .2em; margin-top: 1rem; overflow-wrap: anywhere; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 1rem; }
.tabs button { font: 600 .95rem var(--body); cursor: pointer; background: transparent; color: var(--ink); border: 2px solid var(--ink); padding: 4px 14px; }
.tabs button[aria-selected=true] { background: var(--ink); color: var(--bg); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 0; border-top: 2px solid var(--ink); border-left: 2px solid var(--ink); margin-top: 12px; }
.cell { border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); background: var(--panel); aspect-ratio: 1 / 1.15; display: flex; flex-direction: column; justify-content: space-between; padding: 4px 6px; }
.cell b { font: 400 2.3rem/1.6 var(--display); text-align: center; }
.cell small { font-size: .68rem; color: var(--muted); }
ol.steps { padding-left: 1.4em; max-width: var(--measure); }
ol.steps li::marker { font-family: var(--display); color: var(--accent); }
footer { padding: clamp(50px, 9vh, 100px) var(--gutter) 40px; }
footer p, .mt { font-size: .9rem; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .tester { transition: font-size .15s; } }

  </section>
  <section aria-labelledby="sc-h">
    <h2 id="sc-h" data-i18n="scripts_title"></h2>
    <p data-i18n="scripts_body"></p>
    <div class="scriptlines">
      <div lang="lo"><small data-i18n="lao">Lao</small>ສະບາຍດີ ຫຼວງພະບາງ ນ້ຳ</div>
      <div lang="th"><small data-i18n="thai">Thai</small>สวัสดีครับ ตลาดน้ำ</div>
      <div lang="km"><small data-i18n="khmer">Khmer</small>សួស្តី អង្គរវត្ត ស្ត្រី</div>
      <div lang="en"><small data-i18n="latin">Latin</small>Hello Display 0123</div>
    </div>
  </section>
  <section aria-labelledby="st-h">
    <h2 id="st-h" data-i18n="stack_title"></h2>
    <p data-i18n="stack_body"></p>

  <section aria-labelledby="in-h">

</main>
